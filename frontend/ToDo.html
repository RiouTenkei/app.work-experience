<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="./ToDo.css">

</head>

<body>
    <div>
        <h3>My To Do List</h3>
        <input type="text" id="myInput" placeholder="Type...">
        <span onclick="newElement()" class="addBtn">Add</span>
    </div>
    <ul id="myul">
        <li><input type="checkbox" />Learn JavaScript </li>
        <li><input type="checkbox" />Make a To Do list </li>
        <li><input type="checkbox" />Use CSS to make it look pretty </li>
    </ul>


    <script>
        function newElement() {
            // Create li element
            const li = document.createElement("li");

            // Create input element and append to li
            const input = document.createElement("input");
            input.type = "checkbox";
            li.appendChild(input);

            // Create text node and append to li
            const inputValue = document.getElementById("myInput").value;
            const t = document.createTextNode(inputValue);
            li.appendChild(t);
            {
                document.getElementById("myul").appendChild(li);
            }
            document.getElementById("myInput").value = "";
        }


        async function getTasks() {
            const data = await fetch("http://localhost:3000/tasks");
            console.log(data);
        }

        // getTasks();

        async function getTasksById() {
            const data = await fetch("http://localhost:3000/tasks/3");
            console.log(data)
        }

        // getTasksById();

        async function createTask() {
            const rawData = {name: "Simon"};
            const data = await fetch("http://localhost:3000/tasks", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",

                },
                body: JSON.stringify({...rawData})
            })
            console.log(data);
        }

        createTask();

        async function updateTask() {
            const data = await fetch("http://localhost:3000/tasks/3", {
                method: "PUT",
                body: JSON.stringify({ name: "Simon" })
            })
            console.log(data);
        }

        // updateTask();

        async function deleteTask() {
            const data = await fetch("http://localhost:3000/tasks/2", {
                method: "DELETE"
            })
            console.log(data);
        }



    </script>
</body>

</html>
